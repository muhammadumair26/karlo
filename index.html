<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Karlo" />
    <meta name="description" content="Karlo – boards, lists and cards for getting things done." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Karlo</title>
    <style>
      /* Opening animation: continues the phone's launch screen (solid Karlo blue + white round icon). */
      html, body { margin: 0; background: #1d4ed8; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
        background: linear-gradient(160deg, #1d4ed8 0%, #4338ca 55%, #6d28d9 100%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .45s ease, transform .5s cubic-bezier(.2, .7, .2, 1); }
      #boot.boot-out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #boot::before { content: ''; position: absolute; inset: 0; background: #1d4ed8; animation: bt-fade .8s ease .05s both; }
      #boot .bt-glow { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
        background: radial-gradient(circle, rgba(167, 139, 250, .55) 0%, rgba(167, 139, 250, 0) 62%); animation: bt-glow 2.6s ease-in-out .35s infinite both; }
      #boot .bt-tile { position: relative; width: 112px; height: 112px; border-radius: 32px; background: #fff; display: grid; place-items: center; overflow: hidden;
        box-shadow: 0 22px 60px rgba(17, 12, 70, .38), 0 0 0 10px rgba(255, 255, 255, .1);
        animation: bt-morph .8s cubic-bezier(.34, 1.45, .64, 1) .08s both; }
      #boot .bt-tile img { width: 76px; height: 76px; object-fit: contain; }
      #boot .bt-tile::after { content: ''; position: absolute; inset: -40%; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .85) 50%, transparent 60%);
        transform: translateX(-120%); animation: bt-shine 1.1s ease-in-out .75s both; }
      #boot .bt-word { position: absolute; top: calc(50% + 80px); left: 0; right: 0; text-align: center; color: #fff; font-size: 34px; font-weight: 800;
        letter-spacing: -.02em; text-shadow: 0 2px 14px rgba(17, 12, 70, .35); animation: bt-up .55s cubic-bezier(.2, .7, .2, 1) .45s both; }
      #boot .bt-tag { position: absolute; top: calc(50% + 126px); left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, .78); font-size: 14px; letter-spacing: .02em;
        animation: bt-up .55s cubic-bezier(.2, .7, .2, 1) .6s both; }
      #boot .bt-dots { position: absolute; top: calc(50% + 168px); left: 0; right: 0; display: flex; justify-content: center; gap: 7px; animation: bt-up .4s ease .85s both; }
      #boot .bt-dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: bt-dot 1.1s ease-in-out infinite; }
      #boot .bt-dots i:nth-child(2) { animation-delay: .15s; }
      #boot .bt-dots i:nth-child(3) { animation-delay: .3s; }
      #boot .bt-by { position: absolute; left: 0; right: 0; bottom: calc(34px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 7px;
        animation: bt-up .5s ease .7s both; }
      #boot .bt-by small { color: rgba(255, 255, 255, .75); font-size: 10.5px; font-weight: 700; letter-spacing: .16em; }
      #boot .bt-by span { display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; color: #1f2937; font-size: 14px; font-weight: 700;
        box-shadow: 0 6px 18px rgba(17, 12, 70, .25); }
      #boot .bt-by img { width: 22px; height: 22px; object-fit: contain; }
      #boot .bt-by em { font-style: normal; color: #b91c1c; }
      @keyframes bt-fade { to { opacity: 0; } }
      @keyframes bt-morph { from { transform: scale(1.43); border-radius: 56px; box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
      @keyframes bt-shine { to { transform: translateX(120%); } }
      @keyframes bt-up { from { opacity: 0; transform: translateY(12px); } }
      @keyframes bt-glow { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes bt-dot { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot::before, #boot .bt-tile::after { animation: none !important; } #boot::before { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Opening Karlo">
      <div class="bt-glow"></div>
      <div class="bt-tile"><img src="/karlo-icon.png" alt="" /></div>
      <div class="bt-word">Karlo</div>
      <div class="bt-tag">Plan it. Track it. Get it done.</div>
      <div class="bt-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="bt-by"><small>POWERED BY</small><span><img src="/orion-logo.png" alt="" />Orion <em>Soft Sol</em></span></div>
    </div>
    <script>
      // Safety net: never leave the opening animation up if the app fails to start.
      setTimeout(function () { var b = document.getElementById('boot'); if (b) { b.classList.add('boot-out'); setTimeout(function () { b.remove(); }, 600); } }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
